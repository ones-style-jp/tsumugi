<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <!-- ★ 2026-10-05(店舗報告: 無印iPad 第8世代で画面が少し大きく表示され左右にずれる・上部のボタンがずれる):
         iPad/iPhone の Safari は文字が16px未満の入力欄を押すと自動で拡大し、戻らないまま画面がはみ出す(768px超のiPadは16px化の対象外だった)。
         iOS だけ maximum-scale=1 にして自動拡大を止める(iOS は指での拡大は引き続きできる)。PC・Android は従来どおり -->
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || '';
          var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (ios) {
            var m = document.querySelector('meta[name="viewport"]');
            // ★ 2026-10-12(ユーザー要望): スマホ(短い辺が768px未満)はピンチで拡大・縮小できるように(ホーム画面のアプリは maximum-scale が効くため)。
            // ★ 2026-10-16(ユーザー要望「タブレットでもピンチイン・ピンチアウトできるように」): iPad もスマホと同じく拡大・縮小できるように。
            //   入力欄を押したときの勝手な拡大(2026-10-05 無印iPadで画面が大きくなる不具合)は、アプリ側(tsuInstallIosFocusZoomGuard)で
            //   入力欄に触れた瞬間だけ拡大の上限を1倍にして防ぐ
            if (m) m.setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=4.0, user-scalable=yes, viewport-fit=cover');
            document.documentElement.classList.add('tsu-ios');
            // ★ 2026-10-27: ホーム画面に追加したアプリ(全画面)のときの印。上端のぼかしを止める帯(tsu-edge-band)をこのときだけ出す
            try { if (navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('tsu-ios-app'); } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
    <!-- ★ 2026-10-27(ユーザー報告「iPad でログインすると上部が曇っている・ずっと直っていない」): 本当の原因は、iPadOS 26 以降のホーム画面のアプリで、
         OS が画面の上端(状態表示の下 約40pt)にぼかしを掛けること(Liquid Glass の scroll edge effect)。描き直しの工夫(10/09〜10/22 の8回)では消えなかった。
         WebKit は「上端の中央・上から4pxの所に、幅が画面の9割以上・高さ10pxより大きい・不透明な背景色の fixed の箱」があると、ぼかさずその色で塗る
         (LocalFrameView::fixedContainerEdges)。スマホは上の帯が fixed の白なので出ない。iPad(768px以上)は上の帯が fixed ではないので出ていた。
         そこで、見えない帯(背景色は白だが background-clip:text で何も塗らない・押しても下に通る・いちばん上)を、最初の描画からある形で置く。
         iPhone/iPad のホーム画面のアプリで、幅 768px 以上のときだけ(Safari のタブ・パソコン・Android には出さない) -->
    <style>
      .tsu-edge-band { display: none; }
      @media screen and (min-width: 768px) {
        html.tsu-ios-app .tsu-edge-band { display: block; position: fixed; top: 0; left: 0; right: 0; height: 12px; background-color: #ffffff; -webkit-background-clip: text; background-clip: text; color: transparent; z-index: 2147483647; pointer-events: none; }
      }
    </style>
    <title>つむぎ｜デイサービス管理</title>
    <!-- ★ favicon: 正式マークPNG(無加工)を淡い緑の角丸チップに載せた合成版。
         白いブックマークバー/タブでも背景に溶けず、ダークモードでも明るいチップで視認できる -->
    <link rel="icon" type="image/png" sizes="128x128" href="/preview/tsumugi-favicon-chip-128.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/preview/tsumugi-favicon-chip-512.png" />
    <link rel="apple-touch-icon" href="/preview/tsumugi-favicon-chip-512.png" />
    <!-- ★ ホーム画面に追加したとき、ブラウザのタブ・URL欄の無い全画面(スタンドアロン)で開く(2026-09-28 ユーザー要望) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="つむぎ" />
    <meta name="theme-color" content="#7daa3d" />
  </head>
  <body>
    <div class="tsu-edge-band" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
