<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <!-- ★ 2026-10-05(店舗報告: 無印iPad 第8世代で画面が少し大きく表示され左右にずれる・上部のボタンがずれる):
         iPad/iPhone の Safari は文字が16px未満の入力欄を押すと自動で拡大し、戻らないまま画面がはみ出す(768px超のiPadは16px化の対象外だった)。
         iOS だけ maximum-scale=1 にして自動拡大を止める(iOS は指での拡大は引き続きできる)。PC・Android は従来どおり -->
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || '';
          var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (ios) {
            var m = document.querySelector('meta[name="viewport"]');
            if (m) m.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover');
            document.documentElement.classList.add('tsu-ios');
          }
        } catch (e) {}
      })();
    </script>
    <title>つむぎ｜デイサービス管理</title>
    <!-- ★ favicon: 正式マークPNG(無加工)を淡い緑の角丸チップに載せた合成版。
         白いブックマークバー/タブでも背景に溶けず、ダークモードでも明るいチップで視認できる -->
    <link rel="icon" type="image/png" sizes="128x128" href="/preview/tsumugi-favicon-chip-128.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/preview/tsumugi-favicon-chip-512.png" />
    <link rel="apple-touch-icon" href="/preview/tsumugi-favicon-chip-512.png" />
    <!-- ★ ホーム画面に追加したとき、ブラウザのタブ・URL欄の無い全画面(スタンドアロン)で開く(2026-09-28 ユーザー要望) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="つむぎ" />
    <meta name="theme-color" content="#7daa3d" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
